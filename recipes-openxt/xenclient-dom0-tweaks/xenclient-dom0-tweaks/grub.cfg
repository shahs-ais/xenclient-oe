set default="0"

insmod font
if loadfont /grub/unifont.pf2 ; then
  set gfxmode="1024x768"
  set gfxpayload="keep"
  insmod gfxterm
  insmod vbe
  terminal_output gfxterm
fi

set color_normal=dark-gray/black
set color_highlight=white/dark-gray

insmod png
background_image /grub/booting.png

serial --unit=0 --speed=115200
terminal_output --append serial
terminal_input --append serial

if keystatus --shift; then
    set timeout=-1
    background_image /grub/black.png
else
    set timeout=3
fi

insmod part_gpt
insmod fat
insmod chain

search --no-floppy --file --set=root /efi/OpenXT/xen.efi

menuentry "OpenXT TrenchBoot Secure Launch" {
    slaunch
    slaunch_module /EFI/OpenXT/SKL_KBL_AML_SINIT_20211019_PRODUCTION_REL_NT_O1_1.10.0.bin
    slaunch_module /EFI/OpenXT/LNC_SINIT_REL_NT_O1.PW_signed.bin
    slaunch_module /EFI/OpenXT/ADL_SINIT_v1_18_18_20240523_REL_NT_O1.PW_signed.bin
    slaunch_module /EFI/OpenXT/MTL_SINIT_REL_NT_O1.PW_signed.bin
    slaunch_module /EFI/OpenXT/CFL_SINIT_20221220_PRODUCTION_REL_NT_O1_1.10.1_signed.bin
    slaunch_module /EFI/OpenXT/TGL_SINIT_v1_14_46_20220819_REL_NT_O1.PW_signed.bin
    slaunch_module /EFI/OpenXT/RKLS_SINIT_v1_14_46_20220819_REL_NT_O1.PW_signed.bin
    slaunch_module /EFI/OpenXT/CMLSTGP_SINIT_v1_14_46_20220819_REL_NT_O1.PW_signed.bin
    slaunch_module /EFI/OpenXT/CML_S_SINIT_1_13_33_REL_NT_O1.PW_signed.bin
    chainloader /EFI/OpenXT/xen.efi
    boot
}
