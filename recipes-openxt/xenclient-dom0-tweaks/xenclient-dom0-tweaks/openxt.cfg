[global]
default=openxt-normal
ucode=microcode_intel.bin
sinit=SKL_KBL_AML_SINIT_20211019_PRODUCTION_REL_NT_O1_1.10.0.bin LNC_SINIT_REL_NT_O1.PW_signed.bin ADL_SINIT_v1_18_18_20240523_REL_NT_O1.PW_signed.bin MTL_SINIT_REL_NT_O1.PW_signed.bin CFL_SINIT_20221220_PRODUCTION_REL_NT_O1_1.10.1_signed.bin TGL_SINIT_v1_14_46_20220819_REL_NT_O1.PW_signed.bin RKLS_SINIT_v1_14_46_20220819_REL_NT_O1.PW_signed.bin CMLSTGP_SINIT_v1_14_46_20220819_REL_NT_O1.PW_signed.bin CML_S_SINIT_1_13_33_REL_NT_O1.PW_signed.bin

[openxt-normal]
options=placeholder console=com1 dom0_mem=min:1024M,max:1024M,1024M com1=115200,8n1,pci mbi-video vga=current flask=enforcing loglvl=debug guest_loglvl=debug smt=0 ucode=-1 bootscrub=1 argo=yes,mac-permissive=1
kernel=bzImage root=/dev/mapper/xenclient-root ro boot=/dev/mapper/xenclient-boot swiotlb=16384 xen_pciback.passthrough=1 consoleblank=0 vt.global_cursor_default=0 rootfstype=ext3 bootfstype=ext3 console=hvc0 autostart
ramdisk=initrd
xsm=policy.24
 
[openxt-support-safe-graphics]
options=console=com1 dom0_mem=min:768M,max:768M,768M efi=rs,attr=uc com1=115200,8n1,pci mbi-video vga=current flask=enforcing loglvl=debug guest_loglvl=debug smt=0 ucode=-1 bootscrub=1 argo=yes,mac-permissive=1
